<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ravi+Prakash&family=Hind+Guntur:wght@400;600&family=Special+Elite&display=swap">
<style>
/* Layout: full-bleed hand-painted 90s cinema poster, bulb-lit marquee title up top, cartoon tape deck anchored at the bottom */
:root{
  --maroon:#3a0f1e; --wine:#7d1d2d; --saffron:#e8742a; --marigold:#f5bf4f;
  --cream:#f7e7c4; --ink:#1d0a10; --deck:#dcc597; --deck-shade:#b8995f; --deck-dark:#7a5a34;
  --teal:#2f6f6a; --bulb:#fff1bf;
  --f-te:"Ravi Prakash","Hind Guntur","Noto Sans Telugu",serif;
  --f-body:"Hind Guntur","Noto Sans Telugu",system-ui,sans-serif;
  --f-type:"Special Elite","Courier New",monospace;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--maroon);color:var(--cream);font-family:var(--f-body);overflow-x:hidden}
#poster{position:fixed;inset:0;width:100%;height:100%;display:block}
.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.22;mix-blend-mode:overlay;animation:grain .9s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 45%,rgba(20,4,10,.78))}

main{position:relative;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:24px;padding-inline:16px;padding-block:clamp(16px,4vh,40px) clamp(14px,3vh,28px)}

/* Marquee title */
.marquee{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 4px}
.bulbs{width:min(420px,86vw);height:12px;background:radial-gradient(circle at 50% 50%,var(--bulb) 0 2.6px,var(--marigold) 3.2px,transparent 4.8px) 0 0/18px 12px;filter:drop-shadow(0 0 4px var(--marigold));animation:chase 1.1s steps(2) infinite}
@keyframes chase{to{background-position:9px 0}}
.eyebrow{margin:6px 0 0;font-family:var(--f-type);letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--cream);opacity:.92}
h1{margin:0;font-family:var(--f-te);font-weight:400;font-size:clamp(56px,15vw,120px);line-height:1.05;color:var(--marigold);text-wrap:balance;
  text-shadow:2px 2px 0 var(--wine),4px 4px 0 var(--wine),6px 6px 0 var(--ink),0 0 28px rgba(245,191,79,.45)}
.tag{margin:0 0 6px;font-family:var(--f-te);font-size:clamp(18px,4.6vw,26px);color:var(--cream);text-shadow:2px 2px 0 var(--ink)}

/* Tape deck — cartoon 3D */
.deck-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.deck{width:min(380px,100%);perspective:900px;filter:drop-shadow(0 26px 30px rgba(10,2,6,.6))}
.deck-inner{transform:rotateX(10deg);transform-origin:50% 100%;transition:transform .3s}
.deck.playing .deck-inner{animation:bob .66s ease-in-out infinite alternate}
@keyframes bob{from{transform:rotateX(10deg) translateY(0)}to{transform:rotateX(10deg) translateY(-3px) scaleY(1.01)}}
.handle{width:62%;height:34px;margin:0 auto -6px;border:6px solid var(--ink);border-bottom:none;border-radius:30px 30px 0 0;background:transparent;box-shadow:inset 0 5px 0 var(--deck-dark)}
.body{position:relative;background:linear-gradient(180deg,#ead6aa 0%,var(--deck) 38%,var(--deck-shade) 100%);border:4px solid var(--ink);border-radius:30px;padding:16px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 10px 0 var(--deck-dark),0 10px 0 4px var(--ink),inset 0 4px 0 rgba(255,255,255,.55),inset 0 -6px 0 rgba(0,0,0,.12)}
.body::after{content:"";position:absolute;left:18px;top:10px;width:40%;height:10px;border-radius:10px;background:rgba(255,255,255,.45);pointer-events:none}
.top-row{display:grid;grid-template-columns:0.8fr 1.2fr;gap:12px;align-items:stretch}
.grille{border:3px solid var(--ink);border-radius:18px;background:radial-gradient(circle,var(--ink) 0 2.4px,transparent 3px) 0 0/10px 10px,#c9ad74;box-shadow:inset 0 3px 0 rgba(0,0,0,.18);min-height:110px;position:relative}
.grille::before{content:"STEREO";position:absolute;left:50%;bottom:-2px;transform:translate(-50%,50%);font:11px var(--f-type);letter-spacing:.2em;background:var(--ink);color:var(--marigold);padding:1px 7px;border-radius:6px}
.cassette{border:3px solid var(--ink);border-radius:14px;background:#2a1a1f;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 3px 0 rgba(255,255,255,.08)}
.label{background:linear-gradient(180deg,var(--cream) 0 62%,var(--saffron) 62% 74%,var(--wine) 74%);border-radius:6px;border:2px solid var(--ink);padding:4px 8px 10px;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.label .te{font-family:var(--f-te);font-size:20px;line-height:1}
.label .side{font:10px var(--f-type);letter-spacing:.08em;white-space:nowrap}
.window{display:flex;align-items:center;justify-content:space-between;background:#3d2a2f;border:2px solid var(--ink);border-radius:30px;padding:4px 8px;position:relative}
.window::before{content:"";position:absolute;left:30%;right:30%;top:50%;height:16px;transform:translateY(-50%);background:rgba(247,231,196,.18);border-radius:3px}
.reel{width:44%;max-width:84px;aspect-ratio:1;max-height:84px;animation:spin 1.8s linear infinite;animation-play-state:paused}
.deck.playing .reel{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.mid-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.vu{width:64px;height:40px;border:3px solid var(--ink);border-radius:10px 10px 6px 6px;background:radial-gradient(ellipse at 50% 120%,#fff6d8 0 55%,#f0d896 56%);position:relative;overflow:hidden}
.vu::before{content:"";position:absolute;inset:6px 8px auto;height:20px;border-top:2px dotted var(--wine);border-radius:50% 50% 0 0}
.vu span{position:absolute;left:5px;bottom:2px;font:9px var(--f-type);color:var(--wine)}
.needle{position:absolute;left:50%;bottom:-4px;width:2px;height:38px;background:var(--wine);transform-origin:50% 100%;transform:rotate(-42deg);border-radius:2px}
.now{min-width:0;background:var(--ink);border-radius:10px;padding:6px 10px;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #3a2a2c}
.now-label{display:block;font:10px var(--f-type);letter-spacing:.16em;color:var(--saffron)}
#nowTitle{display:block;font-family:var(--f-type);font-size:13px;color:#9ff0c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 6px rgba(159,240,200,.6)}
.counter{font:16px var(--f-type);font-variant-numeric:tabular-nums;color:var(--cream);background:var(--ink);border-radius:6px;padding:4px 6px;letter-spacing:.12em;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #3a2a2c}
.keys{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.key{appearance:none;cursor:pointer;border:4px solid var(--ink);border-radius:14px;padding:12px 10px 10px;font-family:var(--f-te);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink);
  transition:transform .08s,box-shadow .08s;transform:translateY(0)}
.key .sym{font-family:var(--f-body);font-size:20px}
.key.play{background:linear-gradient(180deg,#8fd1a8,#4f9f7a);box-shadow:0 8px 0 #2b5e47,0 8px 0 4px var(--ink)}
.key.pause{background:linear-gradient(180deg,#f2a06a,var(--saffron));box-shadow:0 8px 0 #8a3c13,0 8px 0 4px var(--ink)}
.key.shuffle{background:linear-gradient(180deg,#8fb8ec,#4a7fc9);box-shadow:0 8px 0 #2c4f86,0 8px 0 4px var(--ink)}
.key.shuffle svg{display:block}
.key.shuffle.cooling{opacity:.45;cursor:not-allowed}
#unclePop{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(24px);z-index:99;display:flex;align-items:flex-end;gap:6px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;filter:sepia(.25)}
#unclePop.show{opacity:1;transform:translateX(-50%) translateY(0)}
#unclePop.bye{opacity:0;transform:translateX(-50%) translateY(16px)}
.uncle-bubble{max-width:238px;background:#f6ead0;border:3px solid #5b2d1e;border-radius:14px;padding:10px 12px;font-family:var(--f-body);font-size:14px;line-height:1.4;color:#4a2417;box-shadow:4px 4px 0 rgba(30,10,5,.3);position:relative;transform:rotate(-2deg)}
.uncle-bubble b{color:#8a2f1d}
.uncle-bubble:after{content:'';position:absolute;right:-15px;bottom:24px;border:9px solid transparent;border-left:11px solid #5b2d1e}
.key[aria-pressed="true"]{transform:translateY(7px);box-shadow:0 1px 0 var(--deck-dark),0 1px 0 4px var(--ink);filter:saturate(.85) brightness(.95)}
.key:focus-visible{outline:3px dashed var(--cream);outline-offset:4px}
.foot{font-size:12px;color:var(--cream);opacity:.8;text-align:center;max-width:42ch;text-shadow:1px 1px 0 var(--ink);margin:0}

@media (prefers-reduced-motion: reduce){
  .grain,.bulbs,.deck.playing .deck-inner{animation:none}
  .reel{animation-duration:6s}
}
</style>

<canvas id="poster" aria-hidden="true"></canvas>
<div class="grain" id="grain" aria-hidden="true"></div>

<main>

  <div class="deck-wrap">

              <div class="window">
                <svg class="reel" viewBox="0 0 100 100"><circle id="tapeL" cx="50" cy="50" r="44" fill="#5a3326"/><circle cx="50" cy="50" r="18" fill="#f7e7c4" stroke="#1d0a10" stroke-width="3"/><g stroke="#1d0a10" stroke-width="5" stroke-linecap="round"><line x1="50" y1="36" x2="50" y2="44"/><line x1="62" y1="57" x2="55" y2="53"/><line x1="38" y1="57" x2="45" y2="53"/></g><circle cx="50" cy="50" r="4" fill="#1d0a10"/></svg>
                <svg class="reel" viewBox="0 0 100 100"><circle id="tapeR" cx="50" cy="50" r="22" fill="#5a3326"/><circle cx="50" cy="50" r="18" fill="#f7e7c4" stroke="#1d0a10" stroke-width="3"/><g stroke="#1d0a10" stroke-width="5" stroke-linecap="round"><line x1="50" y1="36" x2="50" y2="44"/><line x1="62" y1="57" x2="55" y2="53"/><line x1="38" y1="57" x2="45" y2="53"/></g><circle cx="50" cy="50" r="4" fill="#1d0a10"/></svg>

            <button id="shuffleBtn" class="key shuffle" aria-label="Play a different random song"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9A8 8 0 0 1 19 7.5"/><polyline points="19 3.5 19 7.5 15 7.5"/><path d="M19.5 15A8 8 0 0 1 5 16.5"/><polyline points="5 20.5 5 16.5 9 16.5"/></svg></button>
          </div>
        </div>
      </div>
    </section>
    <p class="foot" id="foot">Plays at random, non-stop, for as long as this page is open.</p>
  </div>
</main>

<script>
// ================== CONFIG — put your licensed audio here ==================
// Option A: your own licensed / royalty-free files (e.g. in a /music folder on GitHub Pages)
const PLAYLIST = [
  { title: "Chiranjeevi All Time Hits — Vijayashanti Special", src: "music/chiranjeevi-hits.mp3" },
];
// Option B: a licensed internet-radio stream URL (takes priority over PLAYLIST)
const STREAM_URL = "";
// With both empty, nothing plays until songs are added to PLAYLIST.
// ============================================================================

/* ---------- Painted poster background ---------- */
const cv=document.getElementById('poster'), g=cv.getContext('2d');
function paint(){
  const dpr=Math.min(window.devicePixelRatio||1,2), W=innerWidth, H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  const sky=g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#2a0b19'); sky.addColorStop(.35,'#7d1d2d'); sky.addColorStop(.6,'#d65f2a'); sky.addColorStop(.72,'#f5bf4f');
  g.fillStyle=sky; g.fillRect(0,0,W,H);
  const cx=W/2, cy=H*.46, R=Math.min(W,H)*.3;
  // poster rays
  g.save(); g.translate(cx,cy);
  for(let i=0;i<28;i++){g.rotate(Math.PI*2/28); if(i%2) continue; g.beginPath(); g.moveTo(0,0); g.lineTo(Math.max(W,H),-Math.max(W,H)*.06); g.lineTo(Math.max(W,H),Math.max(W,H)*.06); g.closePath(); g.fillStyle='rgba(255,214,130,.07)'; g.fill();}
  g.restore();
  // stars
  let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  g.fillStyle='rgba(255,241,191,.8)';
  for(let i=0;i<70;i++){const x=rnd()*W,y=rnd()*H*.3; g.beginPath(); g.arc(x,y,rnd()*1.4+.3,0,7); g.fill();}
  // striped retro sun
  const sg=g.createLinearGradient(0,cy-R,0,cy+R); sg.addColorStop(0,'#ffe08a'); sg.addColorStop(1,'#ee7b2c');
  g.save(); g.beginPath(); g.arc(cx,cy,R,0,7); g.clip(); g.fillStyle=sg; g.fillRect(cx-R,cy-R,R*2,R*2);
  g.fillStyle='rgba(125,29,45,.85)';
  for(let k=0;k<7;k++){const y=cy+R*(.05+k*.14), h=R*(.02+k*.018); g.fillRect(cx-R,y,R*2,h);}
  g.restore();
  // halftone
  for(let y=0;y<H*.42;y+=12){for(let x=(y/12%2)*6;x<W;x+=12){const r=1.6*(1-y/(H*.42)); if(r<.2)continue; g.fillStyle='rgba(29,10,16,.35)'; g.beginPath(); g.arc(x,y,r,0,7); g.fill();}}
  const ink='#1d0a10', gy=H*.66;
  // hills
  g.fillStyle='#2a0a16'; g.beginPath(); g.moveTo(0,H);
  g.lineTo(0,gy+H*.02); g.quadraticCurveTo(W*.2,gy-H*.05,W*.42,gy+H*.01); g.quadraticCurveTo(W*.7,gy+H*.05,W,gy-H*.03); g.lineTo(W,H); g.fill();
  // temple gopuram (left)
  const gx=W*.13, gw=Math.min(W*.16,H*.12), gh=H*.3, base=gy+H*.01;
  g.fillStyle=ink; let tiers=6;
  for(let t=0;t<tiers;t++){const w=gw*(1-t*.13), h=gh/tiers; g.fillRect(gx-w/2,base-h*(t+1),w,h+1);}
  g.beginPath(); g.ellipse(gx,base-gh,gw*.22,gh*.05,0,0,7); g.fill();
  for(let i=-1;i<=1;i++){g.beginPath(); g.arc(gx+i*gw*.12,base-gh-gh*.07,gw*.035,0,7); g.fill();}
  // palms (right)
  function palm(x,y,h,lean){g.strokeStyle=ink; g.lineWidth=Math.max(3,h*.04); g.lineCap='round';
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+lean*.5,y-h*.5,x+lean,y-h); g.stroke();
    const tx=x+lean, ty=y-h; g.fillStyle=ink;
    for(let a=0;a<7;a++){const ang=-Math.PI+a*Math.PI/6, L=h*.42; g.beginPath(); g.moveTo(tx,ty);
      g.quadraticCurveTo(tx+Math.cos(ang)*L*.6,ty+Math.sin(ang)*L*.6-h*.12,tx+Math.cos(ang)*L,ty+Math.sin(ang)*L*.5+h*.08);
      g.quadraticCurveTo(tx+Math.cos(ang)*L*.5,ty+Math.sin(ang)*L*.4-h*.04,tx,ty); g.fill();}}
  palm(W*.86,gy+H*.02,H*.3,W*.04); palm(W*.94,gy+H*.03,H*.22,-W*.02);
  // dancing silhouettes — original generic figures, poster style
  const fh=Math.min(H*.2,W*.36), lw=fh*.075; g.strokeStyle=ink; g.fillStyle=ink; g.lineCap='round'; g.lineJoin='round';
  // hero: bell-bottoms, one arm to the sky
  let hx=W*.34, hy=gy-fh*.02; g.lineWidth=lw;
  g.beginPath(); g.moveTo(hx,hy-fh*.48); g.lineTo(hx-fh*.02,hy-fh*.8); g.stroke();
  g.beginPath(); g.arc(hx-fh*.02,hy-fh*.9,fh*.075,0,7); g.fill();
  g.beginPath(); g.moveTo(hx-fh*.05,hy-fh*.98); g.quadraticCurveTo(hx+fh*.06,hy-fh*1.04,hx+fh*.07,hy-fh*.93); g.lineTo(hx-fh*.02,hy-fh*.9); g.fill();
  g.beginPath(); g.moveTo(hx-fh*.02,hy-fh*.74); g.lineTo(hx+fh*.14,hy-fh*.94); g.lineTo(hx+fh*.22,hy-fh*1.12); g.stroke();
  g.beginPath(); g.moveTo(hx-fh*.02,hy-fh*.74); g.lineTo(hx-fh*.16,hy-fh*.62); g.lineTo(hx-fh*.04,hy-fh*.54); g.stroke();
  g.beginPath(); g.moveTo(hx,hy-fh*.48); g.lineTo(hx-fh*.14,hy-fh*.08); g.moveTo(hx,hy-fh*.48); g.lineTo(hx+fh*.12,hy-fh*.08); g.stroke();
  g.beginPath(); g.moveTo(hx-fh*.17,hy-fh*.12); g.lineTo(hx-fh*.26,hy); g.lineTo(hx-fh*.08,hy); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(hx+fh*.09,hy-fh*.12); g.lineTo(hx+fh*.02,hy); g.lineTo(hx+fh*.22,hy); g.closePath(); g.fill();
  // heroine: saree flare, arms up in a dance pose, flowing pallu
  let sx=W*.66, sy=gy+fh*.01;
  g.beginPath(); g.arc(sx,sy-fh*.9,fh*.07,0,7); g.fill();
  g.beginPath(); g.arc(sx-fh*.07,sy-fh*.93,fh*.04,0,7); g.fill();
  g.beginPath(); g.moveTo(sx,sy-fh*.82); g.lineTo(sx+fh*.01,sy-fh*.55); g.stroke();
  g.beginPath(); g.moveTo(sx+fh*.005,sy-fh*.6); g.quadraticCurveTo(sx-fh*.22,sy-fh*.25,sx-fh*.2,sy); g.lineTo(sx+fh*.24,sy); g.quadraticCurveTo(sx+fh*.16,sy-fh*.3,sx+fh*.005,sy-fh*.6); g.fill();
  g.beginPath(); g.moveTo(sx,sy-fh*.76); g.lineTo(sx-fh*.14,sy-fh*.9); g.lineTo(sx-fh*.06,sy-fh*1.06); g.stroke();
  g.beginPath(); g.moveTo(sx,sy-fh*.76); g.lineTo(sx+fh*.15,sy-fh*.86); g.lineTo(sx+fh*.1,sy-fh*1.04); g.stroke();
  g.lineWidth=lw*.5; g.beginPath(); g.moveTo(sx+fh*.02,sy-fh*.78); g.bezierCurveTo(sx+fh*.25,sy-fh*.78,sx+fh*.3,sy-fh*.5,sx+fh*.45,sy-fh*.62); g.stroke();
  // ground haze
  const hz=g.createLinearGradient(0,gy,0,H); hz.addColorStop(0,'rgba(58,15,30,0)'); hz.addColorStop(1,'rgba(29,10,16,.9)'); g.fillStyle=hz; g.fillRect(0,gy,W,H-gy);
}
let rT; addEventListener('resize',()=>{clearTimeout(rT); rT=setTimeout(paint,120);}); paint();
// film grain texture
(()=>{const c=document.createElement('canvas'); c.width=c.height=140; const x=c.getContext('2d'), d=x.createImageData(140,140);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255;}
  x.putImageData(d,0,0); document.getElementById('grain').style.backgroundImage=`url(${c.toDataURL()})`;})();

/* ---------- Player wiring ---------- */
const deck=document.getElementById('deck'), playBtn=document.getElementById('playBtn'), pauseBtn=document.getElementById('pauseBtn'), shuffleBtn=document.getElementById('shuffleBtn');
const nowTitle=document.getElementById('nowTitle'), counter=document.getElementById('counter'), needle=document.getElementById('needle');
const tapeL=document.getElementById('tapeL'), tapeR=document.getElementById('tapeR');
const mode = STREAM_URL ? 'stream' : 'playlist';

let audio=null, playing=false, order=[], oi=0, secs=0;

function setTitle(t){nowTitle.textContent=t; if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:t,artist:'Paata Paatalu Radio'});}catch(e){}}}
function shuffle(n){const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function nextTrack(){ if(oi>=order.length){order=shuffle(PLAYLIST.length); oi=0;} const t=PLAYLIST[order[oi++]]; audio.src=t.src; setTitle(t.title||'Untitled'); audio.play().catch(()=>{}); }

function ensureEngine(){
  if(audio) return;
  
  audio=new Audio(); audio.preload='auto';
  if(mode==='stream'){
    const connect=()=>{audio.src=STREAM_URL+(STREAM_URL.includes('?')?'&':'?')+'t='+Date.now(); if(playing) audio.play().catch(()=>{});};
    ['error','ended','stalled'].forEach(ev=>audio.addEventListener(ev,()=>setTimeout(connect,3000)));
    setTitle('Live · Telugu golden hits'); connect();
  } else {
    audio.addEventListener('ended',nextTrack); audio.addEventListener('error',()=>setTimeout(nextTrack,800)); nextTrack();
  }
}
function setPlaying(on){
  playing=on; deck.classList.toggle('playing',on);
  playBtn.setAttribute('aria-pressed',String(on)); pauseBtn.setAttribute('aria-pressed',String(!on));
  if('mediaSession' in navigator) navigator.mediaSession.playbackState=on?'playing':'paused';
}
function play(){ensureEngine(); if(audio){audio.muted=false; audio.play().catch(()=>{});} setPlaying(true);}
function pause(){if(audio) audio.muted=true; setPlaying(false);}
playBtn.addEventListener('click',play); pauseBtn.addEventListener('click',pause);
/* ---------- Randomize: jump to a different song, once every 10 minutes ---------- */
const SHUFFLE_WAIT=10*60*1000;
let lastShuffle=0;
try{lastShuffle=parseInt(localStorage.getItem('paataShuffleTs')||'0',10)||0;}catch(e){}
function shuffleReady(){return PLAYLIST.length>1&&(Date.now()-lastShuffle>=SHUFFLE_WAIT);}
function paintShuffle(){
  const usable=PLAYLIST.length>1, left=SHUFFLE_WAIT-(Date.now()-lastShuffle), ready=usable&&left<=0;
  shuffleBtn.classList.toggle('cooling',!ready);
  shuffleBtn.title=!usable?'Add more songs to shuffle':(ready?'Play a different random song':'Shuffles again in '+Math.ceil(left/60000)+' min');
  clearTimeout(paintShuffle.t);
  if(usable&&left>0) paintShuffle.t=setTimeout(paintShuffle,Math.min(left,30000));
}
function showUncle(){
  var pop=document.getElementById('unclePop');
  if(!pop){
    pop=document.createElement('div'); pop.id='unclePop';
    pop.innerHTML='<div class="uncle-bubble">Ayyo, patience kanna! For the best radio experience, randomize works only <b>once every 10 minutes</b>. Enjoy the paatalu!</div>'
      +'<svg viewBox="0 0 120 140" width="86" height="100" aria-hidden="true">'
      +'<ellipse cx="48" cy="135" rx="10" ry="4.5" fill="#8a5a38"/><ellipse cx="72" cy="135" rx="10" ry="4.5" fill="#8a5a38"/>'
      +'<rect x="35" y="90" width="50" height="42" rx="4" fill="#ece2c8"/>'
      +'<path d="M48 90v42M60 90v42M72 90v42M35 103h50M35 117h50" stroke="#8a2f23" stroke-width="2" opacity=".5"/>'
      +'<rect x="35" y="85" width="50" height="9" rx="3" fill="#8a2f23"/>'
      +'<rect x="27" y="60" width="13" height="32" rx="6" fill="#c98d5f"/><rect x="80" y="60" width="13" height="32" rx="6" fill="#c98d5f"/>'
      +'<rect x="38" y="58" width="44" height="34" rx="9" fill="#f6f2e6"/>'
      +'<rect x="54" y="50" width="12" height="10" fill="#b57a4e"/>'
      +'<circle cx="38" cy="36" r="5" fill="#c98d5f"/><circle cx="82" cy="36" r="5" fill="#c98d5f"/>'
      +'<circle cx="60" cy="34" r="22" fill="#c98d5f"/>'
      +'<path d="M40 30c-2-8 0-15 6-20" stroke="#f0ead8" stroke-width="7" fill="none" stroke-linecap="round"/>'
      +'<path d="M80 30c2-8 0-15-6-20" stroke="#f0ead8" stroke-width="7" fill="none" stroke-linecap="round"/>'
      +'<circle cx="60" cy="21" r="3.2" fill="#b3231b"/>'
      +'<path d="M46 29l11-2" stroke="#f0ead8" stroke-width="3.5" stroke-linecap="round"/><path d="M74 29l-11-2" stroke="#f0ead8" stroke-width="3.5" stroke-linecap="round"/>'
      +'<circle cx="52" cy="37" r="2.8" fill="#2b1a12"/><circle cx="68" cy="37" r="2.8" fill="#2b1a12"/>'
      +'<path d="M60 47C50 47 41 50 37 58c7-2 14-3 23-4 9 1 16 2 23 4-4-8-13-11-23-11z" fill="#241610"/>'
      +'<path d="M53 63q7 5 14 0" stroke="#7c4f30" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
      +'</svg>';
    document.body.appendChild(pop);
    requestAnimationFrame(function(){pop.classList.add('show');});
  }
  clearTimeout(pop._t);
  pop.classList.remove('bye'); pop.classList.add('show');
  pop._t=setTimeout(function(){pop.classList.add('bye'); setTimeout(function(){if(pop.parentNode)pop.parentNode.removeChild(pop);},450);},3000);
}
function randomize(){
  if(PLAYLIST.length<2) return;
  if(!shuffleReady()){showUncle(); return;}
  lastShuffle=Date.now();
  try{localStorage.setItem('paataShuffleTs',String(lastShuffle));}catch(e){}
  const cur=(audio&&order.length)?order[(oi-1+order.length)%order.length]:-1;
  let n; do{n=Math.floor(Math.random()*PLAYLIST.length);}while(n===cur);
  order=shuffle(PLAYLIST.length);
  const k=order.indexOf(n); order[k]=order[0]; order[0]=n; oi=0;
  const fresh=!audio; ensureEngine(); if(!fresh) nextTrack();
  if(audio){audio.muted=false; audio.play().catch(()=>{});}
  setPlaying(true); paintShuffle();
}
shuffleBtn.addEventListener('click',randomize); paintShuffle();
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault(); playing?pause():play();}});
if('mediaSession' in navigator){try{navigator.mediaSession.setActionHandler('play',play); navigator.mediaSession.setActionHandler('pause',pause);}catch(e){}}

setInterval(()=>{if(playing){secs++; counter.textContent=String(Math.floor(secs/3)%1000).padStart(3,'0');}},1000);

let ang=-42, buf=null;
(function loop(){
  let target=-42;
  if(playing){
    target=-20+Math.random()*50;
  }
  ang+= (target-ang)*.18; needle.style.transform=`rotate(${ang}deg)`;
  let p=0; if(audio&&audio.duration&&isFinite(audio.duration)) p=audio.currentTime/audio.duration; else if(audio) p=(secs%600)/600;
  tapeL.setAttribute('r',(20+24*(1-p)).toFixed(1)); tapeR.setAttribute('r',(20+24*p).toFixed(1));
  requestAnimationFrame(loop);
})();
</script>
